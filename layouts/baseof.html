<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ .Site.Params.description }}">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  {{ with .OutputFormats.Get "RSS" }}
  <link rel="alternate" type="{{ .MediaType.Type }}" title="{{ $.Site.Title }} RSS feed" href="{{ .Permalink }}">
  {{ end }}
  <link rel="icon" href="{{ "assets/favicon.ico" | relURL }}">
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>
<body>
  <header>
    <h1><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></h1>
    <nav>
      <a href="{{ "/about/" | relURL }}">About</a> |
      <a href="https://github.com/jacobwiseberg">GitHub</a> | 
      <a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a> | 
      <a href="{{ "assets/AAA264E1CB85427B5860D7BCEB46C03CBA792675.asc" | relURL }}">PGP</a> | 
      <a href="{{ "blog.xml" | relURL }}">RSS</a>
    </nav>
  </header>
  {{ if not .IsHome }}<a href="{{ "/" | relURL }}" class="back-link">← back</a>{{ end }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <p>&copy; 2025-{{ now.Year }} {{ .Site.Params.author }}. All rights reserved.</p>
  </footer>
</body>
</html>
